[window]
dimensions = { columns = 100, lines = 30 }
padding = { x = 8, y = 8 }
decorations = "full"

[font]
normal = { family = "JetBrainsMonoNF", style = "Regular" }
size = 12.0

[terminal.shell]
program = "/bin/zsh"

[scrolling]
history = 10000

[mouse]
hide_when_typing = true

[colors.primary]
foreground = "#dedede"
background = "#121212"

[colors.cursor]
text = "#F5F1E8"
cursor = "#D27319"

[colors.selection]
text = "#F5F1E8"
background = "#474e91"

[colors.normal]
black = "#929292"
red = "#e27373"
green = "#B5B23C"
yellow = "#D27319"
blue = "#97bedc"
magenta = "#7162ac"
cyan = "#00838D"
white = "#dedede"

[colors.bright]
black = "#bdbdbd"
red = "#ffa1a1"
green = "#D1D36F"
yellow = "#F6D99D"
blue = "#b1d8f6"
magenta = "#C8A2C9"
cyan = "#3CA698"
white = "#F5F1E8"
